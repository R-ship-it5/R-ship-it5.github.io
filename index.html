<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스토리 장면 GIF 메이커</title>
<style>
:root{--bg:#f3f1fa;--card:#fff;--ink:#2b2840;--sub:#6d6a86;--line:#d9d5ee;--acc:#6b4fe0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5}
main{max-width:1100px;margin:0 auto;padding:24px 16px 56px}
h1{font-size:1.5rem;margin:0 0 4px}.lead{margin:0 0 18px;color:var(--sub)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:1rem;margin:0 0 10px}
label{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--sub);margin-bottom:8px}
input,select,textarea{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px;width:100%}
input[type=color]{padding:2px;height:34px}input[type=range]{padding:0}
textarea{min-height:140px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.crow{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;display:grid;grid-template-columns:1fr 1fr 34px;gap:6px}
.crow .rg{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.crow .rg label{margin:0;font-size:.75rem}
.crow input,.crow select{padding:5px;font-size:.8rem}
.crow input[type=range]{padding:0}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabs button:disabled{opacity:.4;cursor:not-allowed}
#pv{cursor:grab;touch-action:none}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:7px 10px}
#go{width:100%;background:var(--acc);color:#fff;border:0;padding:13px;font-weight:700;font-size:1rem}
#go:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
canvas,#out img{width:100%;height:auto;display:block;border-radius:8px;background:#222}
.dl{display:none;margin-top:10px;background:var(--ink);color:#fff;text-align:center;padding:11px;border-radius:8px;text-decoration:none;font-weight:700}
progress{width:100%;display:none;margin-top:8px}
small{color:var(--sub)}
.sticky{position:sticky;top:12px}
</style>
</head>
<body>
<main>
<h1>스토리 장면 GIF 메이커</h1>
<p class="lead">배경 · 캐릭터 · 대화창 · 이름표 이미지를 직접 올려서, 모바일 게임 스토리 같은 대사 GIF를 만들어요. 모든 처리는 내 브라우저 안에서만 이루어져요.</p>
<div class="grid">
<div>
  <div class="card"><h2>이미지</h2>
    <label>배경<input type="file" id="fbg" accept="image/*"></label>
    <label>대화창 (가로로 꽉 차게 아래에 배치돼요. 비우면 기본 대화창)<input type="file" id="fbox" accept="image/*"></label>
    <label>이름표 (비우면 기본 이름표)<input type="file" id="fplate" accept="image/*"></label>
  </div>
  <div class="card"><h2>캐릭터 <small>(배경이 투명한 PNG 권장 · 미리보기에서 드래그해도 옮겨져요)</small></h2>
    <div id="chars"></div>
    <button type="button" id="addc">+ 캐릭터 추가</button>
  </div>
  <div class="card"><h2>대사</h2>
    <label>한 줄에 하나씩, "이름: 대사" 형식 (이름 없이 쓰면 나레이션)
      <textarea id="script">레이: 오늘도 와줬구나. 기다리고 있었어.
미나: 늦어서 미안해! 오래 기다렸지?
레이: 아니, 방금 왔어. 자, 같이 가자.</textarea></label>
  </div>
  <div class="card"><h2>스타일</h2>
    <div class="row">
      <label>출력 크기<select id="size"><option value="960x540">960×540</option><option value="640x360">640×360 (가벼움)</option><option value="1280x720">1280×720 (고화질)</option><option value="540x960">540×960 (세로)</option></select></label>
      <label>타자 속도<select id="speed"><option value="1">느림</option><option value="2" selected>보통</option><option value="4">빠름</option></select></label>
      <label>대사 후 대기(초)<input id="hold" value="1.8" inputmode="decimal"></label>
    </div>
    <div class="row">
      <label>캐릭터 크기 <input type="range" id="csize" min="40" max="130" value="95"></label>
      <label>글자 크기 <input type="range" id="fs" min="8" max="45" value="22"></label>
    </div>
    <div class="row">
      <label>글자 가로 위치 <input type="range" id="tx" min="0" max="60" value="8"></label>
      <label>글자 세로 위치 <input type="range" id="ty" min="0" max="90" value="30"></label>
      <label>글자 영역 너비 <input type="range" id="tw" min="20" max="100" value="84"></label>
    </div>
    <div class="row">
      <label>대화창 크기 <input type="range" id="bs" min="30" max="150" value="100"></label>
      <label>대화창 가로 위치 <input type="range" id="bxo" min="-50" max="50" value="0"></label>
      <label>대화창 세로 위치 <input type="range" id="byo" min="-50" max="50" value="0"></label>
    </div>
    <label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="shownm" checked style="width:auto"> 이름표에 이름 글자 표시</label>
    <div class="row">
      <label>대화창색<input type="color" id="cbox" value="#fdfcff"></label>
      <label>글자색<input type="color" id="cink" value="#2b2840"></label>
      <label>포인트색<input type="color" id="cacc" value="#6b4fe0"></label>
      <label>이름색<input type="color" id="cname" value="#ffffff"></label>
    </div>
    <label>글꼴 파일 (ttf · otf · woff · woff2)<input type="file" id="ffont" accept=".ttf,.otf,.woff,.woff2"></label>
    <small>대화창 이미지를 올리면 대화창색은 쓰이지 않아요. 대화창 크기·위치와 글자 위치를 슬라이더로 맞춰 주세요.</small>
  </div>
</div>
<div class="sticky">
  <div class="card">
    <div class="tabs"><button type="button" id="tedit" class="on">편집 화면</button><button type="button" id="tgif" disabled>완성 GIF</button></div>
    <label>미리볼 대사 (글자가 전부 나온 모습이에요)<select id="pl"></select></label>
    <canvas id="pv"></canvas><div id="out"></div>
    <a class="dl" id="dl" download="story.gif">GIF 다운로드</a>
    <progress id="bar" max="1" value="0"></progress>
    <p><small id="msg"></small></p>
    <button id="go">GIF 만들기</button>
  </div>
</div>
</div>
</main>
<script>
const $=s=>document.querySelector(s),BASE='"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';let FONT=BASE,gifUrl=null,lastO=null,curFace=null;
const S={bg:null,box:null,plate:null}, cache=new Map(); let uid=0;
const load=(input,cb)=>input.addEventListener('change',()=>{const f=input.files[0];if(!f)return cb(null);const im=new Image();im.onload=()=>cb(im);im.src=URL.createObjectURL(f)});
['bg','box','plate'].forEach(k=>load($('#f'+k),im=>{S[k]=im;cache.clear();preview()}));

function addRow(name,x){
  const d=document.createElement('div');d.className='crow';d._id=++uid;
  d.innerHTML=`<input class="cn" placeholder="이름" value="${name}"><input type="file" class="cf" accept="image/*"><button type="button" aria-label="삭제">✕</button><div class="rg"><label>가로<input type="range" class="cx" min="-20" max="120" value="${x}"></label><label>세로<input type="range" class="cy" min="-50" max="50" value="0"></label><label>크기<input type="range" class="cs" min="30" max="200" value="100"></label></div>`;
  load(d.querySelector('.cf'),im=>{d._img=im;preview()});
  d.querySelector('button').onclick=()=>{d.remove();preview()};
  d.addEventListener('input',preview);$('#chars').appendChild(d);
}
addRow('레이',22);addRow('미나',78);
$('#addc').onclick=()=>addRow('',50);

const parse=()=>$('#script').value.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{const m=s.match(/^([^:：]{1,20})[:：]\s*(.+)$/);return m?{who:m[1].trim(),text:m[2]}:{who:'',text:s}});
function opts(){const[W,H]=$('#size').value.split('x').map(Number),v=id=>+$('#'+id).value/100;
  return{W,H,size:v('csize'),fs:+$('#fs').value/1000,tx:v('tx'),ty:v('ty'),tw:v('tw'),bs:v('bs'),bxo:v('bxo'),byo:v('byo'),nm:$('#shownm').checked,box:$('#cbox').value,ink:$('#cink').value,acc:$('#cacc').value,nc:$('#cname').value,
  chars:[...document.querySelectorAll('.crow')].map(r=>({id:r._id,img:r._img,name:r.querySelector('.cn').value.trim(),x:+r.querySelector('.cx').value/100,y:+r.querySelector('.cy').value/100,sc:+r.querySelector('.cs').value/100}))}}
// fs: 슬라이더 29 → 0.029 * W
const rr=(c,x,y,w,h,r)=>{c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h)};
function wrap(c,t,mw){const o=[];let l='';for(const ch of t){if(c.measureText(l+ch).width>mw&&l){o.push(l);l=ch}else l+=ch}o.push(l);return o}
function sprite(c,dim,o){
  const z=o.size*c.sc,k=`${c.id}|${dim}|${o.W}|${o.H}|${z}`;let s=cache.get(k);if(s)return s;if(cache.size>40)cache.clear();
  const h=Math.round(o.H*z),w=Math.round(c.img.width*h/c.img.height);
  s=document.createElement('canvas');s.width=w;s.height=h;const x=s.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(c.img,0,0,w,h);
  if(dim){x.globalCompositeOperation='source-atop';x.fillStyle='rgba(15,15,40,.55)';x.fillRect(0,0,w,h)}
  cache.set(k,s);return s;
}
function draw(ctx,o,l,shown,arrow){
  const{W,H}=o,fs=W*o.fs;ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  if(S.bg){const s=Math.max(W/S.bg.width,H/S.bg.height),w=S.bg.width*s,h=S.bg.height*s;ctx.drawImage(S.bg,(W-w)/2,(H-h)/2,w,h)}
  else{const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#c9c1f0');g.addColorStop(1,'#7f8fd8');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  const cs=o.chars.filter(c=>c.img),isS=c=>l.who&&c.name===l.who;
  o.rects=[];for(const c of [...cs.filter(c=>!isS(c)),...cs.filter(isS)]){const s=sprite(c,!!l.who&&!isS(c),o),px=c.x*W-s.width/2,py=H-s.height+c.y*H;ctx.drawImage(s,px,py);o.rects.push({id:c.id,x:px,y:py,w:s.width,h:s.height})}
  let w0,h0,x0,y0;
  if(S.box){const r=S.box.height/S.box.width;w0=W*Math.min(1,H*.5/(W*r));h0=w0*r;x0=(W-w0)/2;y0=H-h0}
  else{w0=W*.92;h0=H*.27;x0=W*.04;y0=H-h0-H*.04}
  const bw=w0*o.bs,bh=h0*o.bs,bx=x0+(w0-bw)/2+o.bxo*W,by=y0+(h0-bh)+o.byo*H;
  if(S.box)ctx.drawImage(S.box,bx,by,bw,bh);
  else{ctx.globalAlpha=.94;ctx.shadowColor='rgba(0,0,0,.28)';ctx.shadowBlur=fs;ctx.fillStyle=o.box;rr(ctx,bx,by,bw,bh,fs*.5);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.fillStyle=o.acc;rr(ctx,bx+fs,by,bw-fs*2,fs*.18,fs*.09);ctx.fill()}
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`bold ${fs*.9}px ${FONT}`;
  if(l.who){const nw=Math.max(ctx.measureText(l.who).width+fs*2,W*.14),nh=fs*2,nx=bx+bw*.05,ny=by-nh*.55;
    if(S.plate)ctx.drawImage(S.plate,nx,ny,nw,nh);else if(o.nm){ctx.fillStyle=o.acc;rr(ctx,nx,ny,nw,nh,nh/2);ctx.fill()}
    if(o.nm){ctx.fillStyle=o.nc;ctx.fillText(l.who,nx+nw/2,ny+nh/2)}}
  ctx.textAlign='left';ctx.textBaseline='top';ctx.font=`${fs}px ${FONT}`;ctx.fillStyle=o.ink;
  const tx=bx+bw*o.tx,lines=wrap(ctx,l.text,bw*o.tw);let left=shown,y=by+bh*o.ty;
  for(const s of lines){if(left<=0)break;ctx.fillText(s.slice(0,left),tx,y);left-=s.length;y+=fs*1.55}
  if(arrow){const ax=bx+bw*(o.tx+o.tw)-fs,ay=by+bh-fs*1.8;ctx.fillStyle=o.acc;ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(ax+fs*.9,ay);ctx.lineTo(ax+fs*.45,ay+fs*.7);ctx.fill()}
}
function preview(){const o=opts(),c=$('#pv');c.width=o.W;c.height=o.H;fillLines();const L=parse(),l=L[+$('#pl').value]||L[0]||{who:'',text:''};
  draw(c.getContext('2d'),o,l,l.text.length,true);lastO=o;show('edit')}
function fillLines(){const L=parse(),s=$('#pl'),cur=s.value;s.innerHTML='';L.forEach((l,i)=>s.add(new Option(`${i+1}. ${l.who?l.who+': ':''}${l.text.slice(0,18)}`,i)));if(cur!==''&&+cur<L.length)s.value=cur}
function show(m){$('#pv').style.display=m=='edit'?'block':'none';$('#out').style.display=m=='gif'?'block':'none';
  $('#dl').style.display=m=='gif'&&gifUrl?'block':'none';$('#tedit').classList.toggle('on',m=='edit');$('#tgif').classList.toggle('on',m=='gif')}
$('#tedit').onclick=()=>show('edit');$('#tgif').onclick=()=>show('gif');
$('#ffont').addEventListener('change',async()=>{const f=$('#ffont').files[0];if(curFace){document.fonts.delete(curFace);curFace=null}FONT=BASE;
  if(f){try{curFace=new FontFace('UserFont',await f.arrayBuffer());await curFace.load();document.fonts.add(curFace);FONT='"UserFont",'+BASE}
    catch(e){curFace=null;$('#msg').textContent='글꼴을 불러오지 못했어요. ttf, otf, woff, woff2 파일인지 확인해 주세요.'}}
  cache.clear();preview()});
let drag=null;const pv=$('#pv');
const pt=e=>{const r=pv.getBoundingClientRect();return{x:(e.clientX-r.left)*pv.width/r.width,y:(e.clientY-r.top)*pv.height/r.height}};
pv.addEventListener('pointerdown',e=>{const p=pt(e),hit=[...(lastO.rects||[])].reverse().find(r=>p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h);
  if(!hit)return;const row=[...document.querySelectorAll('.crow')].find(r=>r._id==hit.id);
  drag={row,dx:p.x-(hit.x+hit.w/2),dy:p.y-hit.y,h:hit.h};pv.setPointerCapture(e.pointerId);e.preventDefault()});
pv.addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e),o=lastO;
  drag.row.querySelector('.cx').value=Math.round((p.x-drag.dx)/o.W*100);
  drag.row.querySelector('.cy').value=Math.round(((p.y-drag.dy)-(o.H-drag.h))/o.H*100);preview()});
pv.addEventListener('pointerup',()=>drag=null);
document.querySelectorAll('input:not([type=file]),select,textarea').forEach(e=>e.addEventListener('input',preview));

// ---- 팔레트(미디언 컷) + GIF 인코더 ----
const ch=(c,k)=>(c>>(10-5*k))&31, BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function makePalette(hist){
  const items=[];for(let c=0;c<32768;c++)if(hist[c])items.push(c);
  const mk=a=>{const mn=[31,31,31],mx=[0,0,0];let pop=0;
    for(const c of a){for(let k=0;k<3;k++){const v=ch(c,k);if(v<mn[k])mn[k]=v;if(v>mx[k])mx[k]=v}pop+=hist[c]}
    let k=0,r=0;for(let i=0;i<3;i++)if(mx[i]-mn[i]>=r){r=mx[i]-mn[i];k=i}
    return{a,k,pop,s:a.length>1?pop*(r+1):0}};
  const boxes=[mk(items)];
  while(boxes.length<256){let bi=0;for(let i=1;i<boxes.length;i++)if(boxes[i].s>boxes[bi].s)bi=i;
    const b=boxes[bi];if(!b.s)break;b.a.sort((x,y)=>ch(x,b.k)-ch(y,b.k));
    let acc=0,cut=1;for(let i=0;i<b.a.length-1;i++){acc+=hist[b.a[i]];cut=i+1;if(acc>=b.pop/2)break}
    boxes.splice(bi,1,mk(b.a.slice(0,cut)),mk(b.a.slice(cut)))}
  const pal=new Uint8Array(768);
  boxes.forEach((b,i)=>{const s=[0,0,0];for(const c of b.a)for(let k=0;k<3;k++)s[k]+=ch(c,k)*hist[c];for(let k=0;k<3;k++)pal[i*3+k]=Math.min(255,Math.round(s[k]/b.pop*8+4))});
  const n=boxes.length,lut=new Uint8Array(32768).fill(255);
  const near=key=>{const r=ch(key,0)*8+4,g=ch(key,1)*8+4,b=ch(key,2)*8+4;let bi=0,bd=1e9;
    for(let i=0;i<n;i++){const d=(pal[i*3]-r)**2+(pal[i*3+1]-g)**2+(pal[i*3+2]-b)**2;if(d<bd){bd=d;bi=i}}return bi};
  return{pal,lut,near};
}
function quant(d,W,H,px,P){let i=0;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++,i++){const t=(BAY[(y&3)*4+(x&3)]-7.5)*1.3,p=i*4;
    let r=d[p]+t,g=d[p+1]+t,b=d[p+2]+t;r=r<0?0:r>255?255:r;g=g<0?0:g>255?255:g;b=b<0?0:b>255?255:b;
    const k=((r>>3)<<10)|((g>>3)<<5)|(b>>3);let v=P.lut[k];if(v===255)v=P.lut[k]=P.near(k);px[i]=v}}
function lzw(px){
  const out=[];let cur=0,nb=0,size=9,next=258;const dict=new Map();
  const emit=c=>{cur|=c<<nb;nb+=size;while(nb>=8){out.push(cur&255);cur>>=8;nb-=8}};
  emit(256);let pre=px[0];
  for(let i=1;i<px.length;i++){const k=px[i],key=pre*256+k,v=dict.get(key);
    if(v!==undefined){pre=v;continue}
    emit(pre);dict.set(key,next++);
    if(next===4096){emit(256);dict.clear();size=9;next=258}else if(next>(1<<size))size++;
    pre=k}
  emit(pre);emit(257);if(nb>0)out.push(cur&255);return out;
}
function framePart(px,prev,W,H,delay){
  let x0=0,y0=0,x1=W-1,y1=H-1;
  if(prev){x0=W;y0=H;x1=-1;y1=-1;for(let y=0;y<H;y++){const r=y*W;for(let x=0;x<W;x++)if(px[r+x]!==prev[r+x]){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
    if(x1<0){x0=y0=x1=y1=0}}
  const w=x1-x0+1,h=y1-y0+1,sub=new Uint8Array(w*h);
  for(let y=0;y<h;y++)sub.set(px.subarray((y+y0)*W+x0,(y+y0)*W+x0+w),y*w);
  const o=[0x21,0xF9,4,0x04,delay&255,delay>>8,0,0,0x2C,x0&255,x0>>8,y0&255,y0>>8,w&255,w>>8,h&255,h>>8,0,8];
  const d=lzw(sub);for(let i=0;i<d.length;i+=255){const n=Math.min(255,d.length-i);o.push(n);for(let j=0;j<n;j++)o.push(d[i+j])}o.push(0);
  return new Uint8Array(o);
}
const tick=()=>new Promise(r=>setTimeout(r));
$('#go').onclick=async()=>{
  const o=opts(),L=parse(),{W,H}=o;if(!L.length){$('#msg').textContent='대사를 입력해 주세요.';return}
  const step=+$('#speed').value,hold=Math.max(.3,parseFloat($('#hold').value)||1.8);
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d',{willReadFrequently:true});
  $('#go').disabled=true;$('#bar').style.display='block';$('#msg').textContent='색상 분석 중...';cache.clear();await tick();
  const hist=new Uint32Array(32768),every=Math.max(1,Math.floor(L.length/12));
  for(let j=0;j<L.length;j+=every){draw(ctx,o,L[j],L[j].text.length,true);const d=ctx.getImageData(0,0,W,H).data;
    for(let p=0;p<d.length;p+=20)hist[((d[p]>>3)<<10)|((d[p+1]>>3)<<5)|(d[p+2]>>3)]++}
  const P=makePalette(hist),plan=[];
  for(const l of L){for(let n=step;n<l.text.length;n+=step)plan.push({l,n,a:false,ms:60});plan.push({l,n:l.text.length,a:true,ms:hold*1000})}
  const head=[...'GIF89a'].map(c=>c.charCodeAt(0));
  head.push(W&255,W>>8,H&255,H>>8,0xF7,0,0,...P.pal,0x21,0xFF,11,...[...'NETSCAPE2.0'].map(c=>c.charCodeAt(0)),3,1,0,0,0);
  const parts=[new Uint8Array(head)];let prev=null;const px=new Uint8Array(W*H);
  for(let i=0;i<plan.length;i++){const p=plan[i];draw(ctx,o,p.l,p.n,p.a);
    quant(ctx.getImageData(0,0,W,H).data,W,H,px,P);
    parts.push(framePart(px,prev,W,H,Math.round(p.ms/10)));prev=px.slice();
    $('#bar').value=(i+1)/plan.length;$('#msg').textContent=`만드는 중... ${i+1}/${plan.length}`;await tick()}
  parts.push(new Uint8Array([0x3B]));
  const blob=new Blob(parts,{type:'image/gif'}),url=URL.createObjectURL(blob);
  $('#out').innerHTML='';const im=new Image();im.src=url;$('#out').appendChild(im);
  $('#dl').href=url;gifUrl=url;$('#tgif').disabled=false;show('gif');
  $('#msg').textContent=`완료! ${plan.length}프레임 · ${(blob.size/1048576).toFixed(2)}MB`;
  $('#bar').style.display='none';$('#go').disabled=false;
};
preview();
</script>
